[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wb2codex"
version = "1.1.0"
description = "把 WorkBuddy 的本地会话迁移进 Codex（含 paginated 存储格式）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xmgzxmgz" }]
keywords = ["workbuddy", "codex", "migration", "session", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xmgzxmgz/wb2codex"
Issues = "https://github.com/xmgzxmgz/wb2codex/issues"

[project.scripts]
wb2codex = "wb2codex.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["wb2codex"]
